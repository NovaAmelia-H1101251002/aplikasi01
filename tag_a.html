<!DOCTYPE html>
<html>

<head>
    <title>Atribut dari Tag A</title>
</head>

<body>
    <p>Contoh link ke alamat Google:</p>
    <a href="http://www.google.com">Ini link ke google.com</a>
    <p>Atribut target: <i>_blank</i> (window baru), <i>_self</i>
        (window sama - default), <i>_parent</i>, <i>_top</i>.</p>
    <p>Contoh link dengan target="_blank":</p>
    <a target="_blank" href="https://nasional.kompas.com/read/2026/08/23/10111301/prabowo-hadiri-pernikahan-kasesprinya-rizky-irmansyah-bakal-jadi-saksi-akad">
       Berita yang diharapkan kalau ini hoax</a>
</body>

</html>
